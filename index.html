<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Jack</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="gameloop.js" defer></script>
</head>
<body>
    <div class="start-screen" id="start-screen">
        <button id="EXIT" type="button">
            <img src="exit.png" alt="Avsluta spel">
        </button>
        <h1>Black Jack</h1>
        <h1 id="startMoney"></h1>

        <h1 id="currentBet">Nuvarande insats: 0 kr</h1>
        <h1 id="betERROR"></h1>
        <div class="bet-container">
            <button id="bet100" type="button">
                <img src="/chips/bet100.png" alt="Satsa 100 kr">
            </button>
            <button id="bet250" type="button">
                <img src="/chips/bet250.png" alt="Satsa 250 kr">
            </button>
            <button id="bet500" type="button">
                <img src="/chips/bet500.png" alt="Satsa 500 kr">
            </button>
            <button id="bet1000" type="button">
                <img src="/chips/bet1000.png" alt="Satsa 1000 kr">
            </button>
            <button id="resetBet" type="button">
                <img src="reset.png" alt="Återställ insats">
            </button>

        </div>
        <button id="start-game">Starta spel</button>
    </div>

    <div class="game-container hidden" id="main-game">

        <div class="dealer-info">
            <h1 id="dealer"></h1>
        </div>
        <div class="dealer-hand" id="dealer-hand"></div>


        <div class="results">
            <h1 id="nummerText"></h1>
            <h1 id="dealerText"></h1>
        </div>


        <div class="player-info">
            <h1 id="nummer"></h1>
            <h1 id="money"></h1>
            <h1 id="activeBet"></h1>
        </div>
        <div class="player-hand" id="player-hand"></div>


        <div class="game-controls">
            <button id="get-number">Få ett kort</button>
            <button id="stand">Stanna</button>
            <button id="reset">Reset bet</button>
        </div>
    </div>
</body>
</html>
