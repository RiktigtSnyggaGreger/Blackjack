<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Jack</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="gameloop.js" defer></script>
</head>
<body>

    <h1 id="dealer"></h1>
    <div id="dealer-hand"></div>
    <!-- Dealer eller Player text win -->
    <h1 id="nummerText"></h1>
    <h1 id="dealerText"></h1>

    <h1 id="nummer"></h1>
    <div id="player-hand"></div>
    <button id="get-number">Få ett kort</button>
    <button id="stand">Stanna</button>
    <button id="reset">Reset</button>
    <h1 id="money"></h1>

    <h1 id="currentBet"></h1>

    <button id="bet100" type="button">
        <img src="/chips/bet100.png" alt="Satsa 100 kr" width="50">
    </button>

    <button id="bet250" type="button">
        <img src="/chips/bet250.png" alt="Satsa 250 kr" width="50">
    </button>

    <button id="bet500" type="button">
        <img src="/chips/bet500.png" alt="Satsa 500 kr" width="50">
    </button>

    <button id="bet1000" type="button">
        <img src="/chips/bet1000.png" alt="Satsa 1000 kr" width="50">
    </button>
</body>
</html>
